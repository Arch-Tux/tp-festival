services:
  db:
    image: postgres:15
    container_name: "festival_postgresql"
    restart: always
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      POSTGRES_USER: ${DB_USER_NAME}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  
  adminer:
    image: adminer:latest
    container_name: "festival_adminer"
    depends_on:
      - db
    environment:
      ADMINER_DESIGN: "pepa-linha"
    ports:
      - "${ADMINER_PORT}:8080"
    restart: always

volumes:
  db_data: